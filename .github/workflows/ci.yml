name: CI

# Gates every PR and every push to main — the same triggers as qeetrix-react's,
# qeetrix-icons' and qeetrix-docs' CI.
#
# The workshop renders the PUBLISHED @qeetrix/react and @qeetrix/tokens that bun.lock
# installs, exactly as a Qeet product does: no sibling checkout, no source aliases.
# Upgrading @qeetrix/react is therefore a PR here like any other change, and this job
# is what proves every story still renders, passes its interactions and passes axe on
# the new release.
#
# Every gate runs even after an earlier one fails (`if: !cancelled()`), so one
# run reports the state of all of them. The job still fails overall.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  # Keep in step with the resolved `playwright` version in bun.lock.
  PLAYWRIGHT_VERSION: 1.62.1

jobs:
  verify:
    name: lint · typecheck · stories · test · build
    # Pinned rather than ubuntu-latest: `playwright install --with-deps` supports
    # the images Playwright has been released against.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: react
        name: which @qeetrix/react release does bun.lock install?
        run: |
          set -euo pipefail
          version=$(grep -oE '"@qeetrix/react@[0-9]+\.[0-9]+\.[0-9]+"' bun.lock | head -1 | tr -d '"' | cut -d@ -f3)
          if [ -z "$version" ]; then
            echo "::error::bun.lock does not resolve @qeetrix/react."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Rendering @qeetrix/react $version."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - id: setup
        run: bun install --frozen-lockfile

      # `bun run test` is Vitest browser mode in headless Chromium.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bunx playwright install --with-deps chromium

      - id: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint

      # Also writes .storybook/docgen.json, the props tables, from the package's types.
      - id: typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run typecheck

      - id: verify_stories
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run verify:stories

      - id: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run test

      - id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run build

      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

      - if: ${{ !cancelled() }}
        name: summarise
        run: |
          {
            echo "Rendering \`@qeetrix/react\` ${{ steps.react.outputs.version }}."
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| lint | ${{ steps.lint.outcome || 'skipped' }} |"
            echo "| typecheck | ${{ steps.typecheck.outcome || 'skipped' }} |"
            echo "| verify:stories | ${{ steps.verify_stories.outcome || 'skipped' }} |"
            echo "| test | ${{ steps.test.outcome || 'skipped' }} |"
            echo "| build | ${{ steps.build.outcome || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
