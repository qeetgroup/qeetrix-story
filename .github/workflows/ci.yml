name: CI

# Gates every PR and every push to main — the same triggers as qeetrix-ui's,
# qeetrix-icons' and qeetrix-docs' CI.
#
# THIS REPO DOES NOT BUILD FROM ITS node_modules COPY OF @qeetrix/ui.
# `.storybook/main.ts` (and `vitest.config.ts`, which reuses it) aliases
# `@qeetrix/ui` to a SIBLING SOURCE CHECKOUT at `../qeetrix-ui/src`; the published
# tarball ships `dist/` only. So the job checks out both repos side by side under
# $GITHUB_WORKSPACE, which reproduces the `../qeetrix-ui` path exactly.
# `qeetgroup/qeetrix-ui` is public, so the default GITHUB_TOKEN can clone it.
#
# The qeetrix-ui checkout is the release tag of the @qeetrix/ui version bun.lock
# installs. `bun run typecheck` reads the installed package's types while `test`
# and `build` render the checkout, so the two must be the same release: tracking
# qeetrix-ui@main let a removed export pass the type check and fail only at
# import. Upgrading @qeetrix/ui is therefore a PR here like any other change.
#
# Every gate runs even after an earlier one fails (`if: !cancelled()`), so one
# run reports the state of all of them. The job still fails overall.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  # Keep in step with the resolved `playwright` version in bun.lock.
  PLAYWRIGHT_VERSION: 1.62.1

jobs:
  verify:
    name: lint · typecheck · stories · test · build
    # Pinned rather than ubuntu-latest: `playwright install --with-deps` supports
    # the images Playwright has been released against.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qeetrix-story
    steps:
      - uses: actions/checkout@v4
        with:
          path: qeetrix-story

      - id: ui
        name: which @qeetrix/ui release does bun.lock install?
        run: |
          set -euo pipefail
          version=$(grep -oE '"@qeetrix/ui@[0-9]+\.[0-9]+\.[0-9]+"' bun.lock | head -1 | tr -d '"' | cut -d@ -f3)
          if [ -z "$version" ]; then
            echo "::error::bun.lock does not resolve @qeetrix/ui."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Rendering qeetrix-ui v$version."

      - name: Checkout qeetrix-ui at that release
        uses: actions/checkout@v4
        with:
          repository: qeetgroup/qeetrix-ui
          ref: v${{ steps.ui.outputs.version }}
          path: qeetrix-ui

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('qeetrix-story/bun.lock', 'qeetrix-ui/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - run: bun install --frozen-lockfile

      # The workshop resolves the sibling's own dependencies through its node_modules.
      - working-directory: qeetrix-ui
        run: bun install --frozen-lockfile

      # tokens.css / tokens.raw.css / tokens.json / lib/token-values.ts are generated
      # and gitignored in qeetrix-ui, so a fresh clone lacks them.
      - id: setup
        working-directory: qeetrix-ui
        run: bun run build:tokens

      # `bun run test` is Vitest browser mode in headless Chromium.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bunx playwright install --with-deps chromium

      - id: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint

      - id: typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run typecheck

      - id: verify_stories
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run verify:stories

      - id: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run test

      # Also regenerates llms.txt / llms-full.txt from the sibling source.
      - id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run build

      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: qeetrix-story/storybook-static
          retention-days: 7

      - if: ${{ !cancelled() }}
        name: summarise
        run: |
          {
            echo "Rendering \`qeetrix-ui\` v${{ steps.ui.outputs.version }}."
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| lint | ${{ steps.lint.outcome || 'skipped' }} |"
            echo "| typecheck | ${{ steps.typecheck.outcome || 'skipped' }} |"
            echo "| verify:stories | ${{ steps.verify_stories.outcome || 'skipped' }} |"
            echo "| test | ${{ steps.test.outcome || 'skipped' }} |"
            echo "| build | ${{ steps.build.outcome || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
