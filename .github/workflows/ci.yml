name: CI

# Verify, once per change: on every pull request into develop (Dependabot's, a contributor's) and on the
# develop → main pull request, which is what main takes. Pushes run nothing, so no commit is checked twice.
#
# The workshop renders the PUBLISHED @qeetrix/react and @qeetrix/tokens that bun.lock installs, exactly as a Qeet
# product does: upgrading @qeetrix/react is a pull request here like any other change. Verify is the quick gate:
# install, Biome, the types (which also write the props tables) and the stories' documentation check. The browser
# tests (every story's interactions and axe) and the build run locally before pushing (CONTRIBUTING.md, "Before you
# push"); the release builds the workshop again when it deploys.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: format and lint (Biome)
        run: bun run lint
      # Also writes .storybook/docgen.json, the props tables, from the package's types.
      - run: bun run typecheck
      - name: every component documented and tagged
        run: bun run verify:stories
